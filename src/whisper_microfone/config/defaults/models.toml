# Catálogo de modelos e perfis de uso
# Edite este arquivo em %APPDATA%\whisper-microfone\config\models.toml

default_profile = "balanced"

# ============================================================
# Perfis de uso
# ============================================================

[profiles.economic]
name = "small"
compute_type = "int8_float16"
device = "auto"
unload_after_idle_seconds = 60
preload_on_startup = false
description_pt = "Uso esporádico — descarrega modelo rapidamente para liberar VRAM"
description_en = "Sporadic use — unloads model quickly to free VRAM"

[profiles.balanced]
name = "small"
compute_type = "int8_float16"
device = "auto"
unload_after_idle_seconds = 180
preload_on_startup = false
description_pt = "Perfil recomendado — equilíbrio entre latência e consumo de recursos"
description_en = "Recommended profile — balance between latency and resource usage"

[profiles.always_ready]
name = "small"
compute_type = "int8_float16"
device = "auto"
unload_after_idle_seconds = 0
preload_on_startup = true
description_pt = "Modelo sempre carregado — latência mínima, maior consumo de VRAM"
description_en = "Model always loaded — minimal latency, higher VRAM usage"

# ============================================================
