name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python scripts/build_exe.py --onefile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-microfone-exe
          path: dist/whisper-microfone.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Criar Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: whisper-microfone-exe
          path: dist/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Whisper Microfone ${{ github.ref_name }}
          body: "Veja [CHANGELOG.md](CHANGELOG.md) para detalhes."
          files: dist/whisper-microfone.exe
          fail_on_unmatched_files: true
